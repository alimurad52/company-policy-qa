version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"] # http/grpc
    volumes: ["qdrant_storage:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:6333/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Server config
      SERVER_PORT: "8080"

      # AWS Bedrock config
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      CHAT_MODEL: "openai.gpt-4o-mini"
      CHAT_TEMPERATURE: "0.3"
      EMBED_MODEL: "amazon.titan-embed-text-v2"

      # Qdrant config
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6334"
      QDRANT_TLS: "false"
      QDRANT_API_KEY: ""   # optional, leave empty if not using auth
      QDRANT_COLLECTION: "policy_chunks"
      QDRANT_INIT_SCHEMA: "true"

    ports: ["8080:8080"]
    depends_on:
      - qdrant

volumes:
  qdrant_storage: {}