server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true   # nice with MVC for blocking I/O (PDF, DB)
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  ai:
    aws:
      bedrock:
        region: ${AWS_REGION:us-east-1}
        chat:
          model: ${CHAT_MODEL:openai.gpt-4o-mini}
          options:
            model: ${CHAT_MODEL:openai.gpt-4o-mini}
            temperature: ${CHAT_TEMPERATURE:0.3}
        embedding:
          model: ${EMBED_MODEL:amazon.titan-embed-text-v2}
          options:
            model: ${EMBED_MODEL:amazon.titan-embed-text-v2}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}          # gRPC port
        use-tls: ${QDRANT_TLS:false}
        api-key: ${QDRANT_API_KEY:}        # optional; leave empty if none
        collection-name: ${QDRANT_COLLECTION:policy_chunks}
        initialize-schema: ${QDRANT_INIT_SCHEMA:true}  # auto-create collection
